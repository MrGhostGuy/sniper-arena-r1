function drawKillFX(x,y,f,age){
 if(age<0)age=0; if(age>1)age=1;
 var c=f.color, i, a;
 ctx.save(); ctx.translate(x,y);
 if(f.kind==='burst'){
  ctx.strokeStyle=c; ctx.globalAlpha=1-age; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,4+age*26,0,7); ctx.stroke();
  ctx.fillStyle=c;
  for(i=0;i<8;i++){a=i/8*Math.PI*2;var d=age*30;ctx.globalAlpha=1-age;ctx.fillRect(Math.cos(a)*d-1.5,Math.sin(a)*d-1.5,3,3);}
 } else if(f.kind==='puff'){
  for(i=0;i<7;i++){a=i/7*Math.PI*2;var px=Math.cos(a)*(6+age*20),py=Math.sin(a)*(4+age*12)-age*8;
   ctx.fillStyle=c;ctx.globalAlpha=0.5*(1-age);ctx.beginPath();ctx.arc(px,py,5+age*9,0,7);ctx.fill();}
 } else if(f.kind==='ring'){
  ctx.strokeStyle=c; ctx.lineWidth=3.5*(1-age)+0.5; ctx.globalAlpha=1-age;
  ctx.beginPath(); ctx.arc(0,0,6+age*52,0,7); ctx.stroke();
  ctx.globalAlpha=0.6*(1-age); ctx.beginPath(); ctx.arc(0,0,4+age*30,0,7); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.globalAlpha=Math.max(0,0.7-age*1.4); ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill();
 } else if(f.kind==='embers'){
  for(i=0;i<11;i++){var sp=prand(i,31),px=(sp-0.5)*44*age,py=6-age*(26+prand(i,32)*30)+Math.sin(age*9+i)*2;
   ctx.fillStyle=i%3?'#ff8c1a':c;ctx.globalAlpha=1-age;ctx.fillRect(px,py,2.6,2.6);}
  ctx.strokeStyle=c;ctx.globalAlpha=0.7*(1-age);ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,4+age*20,0,7);ctx.stroke();
 } else if(f.kind==='shatter'){
  ctx.fillStyle=c;
  for(i=0;i<7;i++){a=i/7*Math.PI*2+age*1.2;var d2=age*34;ctx.save();ctx.translate(Math.cos(a)*d2,Math.sin(a)*d2);ctx.rotate(a+age*3);
   ctx.globalAlpha=1-age;ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(4,4);ctx.lineTo(-4,4);ctx.closePath();ctx.fill();ctx.restore();}
  ctx.fillStyle='#fff';ctx.globalAlpha=Math.max(0,0.8-age*1.6);ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();
 } else if(f.kind==='nova'){
  ctx.fillStyle=c; ctx.globalAlpha=Math.max(0,0.55-age*1.1); ctx.beginPath(); ctx.arc(0,0,12+age*16,0,7); ctx.fill();
  ctx.strokeStyle=c; ctx.lineWidth=2.4;
  for(i=0;i<10;i++){a=i/10*Math.PI*2;var r1=6+age*10,r2=16+age*40;ctx.globalAlpha=1-age;
   ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke();}
  ctx.strokeStyle='#fff';ctx.globalAlpha=1-age;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,5+age*46,0,7);ctx.stroke();
 } else if(f.kind==='bolt'){
  if(age<0.45){var seed=Math.floor(age*40);ctx.strokeStyle=c;ctx.lineWidth=3;ctx.globalAlpha=1;
   ctx.beginPath();var bx=0;ctx.moveTo(bx,-190);
   for(i=1;i<=6;i++){bx=(prand(seed+i,41)-0.5)*22;ctx.lineTo(bx,-190+i*31);}
   ctx.lineTo(0,0);ctx.stroke();
   ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();}
  ctx.fillStyle='#fff';ctx.globalAlpha=Math.max(0,0.8-age*1.5);ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
  ctx.strokeStyle=c;ctx.globalAlpha=1-age;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(0,0,6+age*40,0,7);ctx.stroke();
 } else if(f.kind==='souls'){
  ctx.strokeStyle=c;ctx.globalAlpha=0.8*(1-age);ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,5+age*30,0,7);ctx.stroke();
  for(i=0;i<3;i++){var ph=age*(30+i*13),wx=Math.sin(age*7+i*2.1)*9,wy=-ph;
   ctx.fillStyle=c;ctx.globalAlpha=0.85*(1-age);ctx.beginPath();ctx.arc(wx,wy,5.5-i,0,7);ctx.fill();
   ctx.fillStyle='#0b0e18';ctx.fillRect(wx-2.6,wy-1.4,1.8,1.8);ctx.fillRect(wx+0.9,wy-1.4,1.8,1.8);}
 } else if(f.kind==='meteor'){
  if(age<0.35){var mp=age/0.35,mx=90-mp*90,my=-130+mp*130;
   ctx.strokeStyle=c;ctx.lineWidth=3;ctx.globalAlpha=0.8;ctx.beginPath();ctx.moveTo(mx+26,my-34);ctx.lineTo(mx,my);ctx.stroke();
   ctx.fillStyle='#ffd23f';ctx.globalAlpha=1;ctx.beginPath();ctx.arc(mx,my,6,0,7);ctx.fill();
   ctx.fillStyle=c;ctx.beginPath();ctx.arc(mx,my,3.6,0,7);ctx.fill();}
  else {var ea=(age-0.35)/0.65;ctx.strokeStyle=c;ctx.lineWidth=3;ctx.globalAlpha=1-ea;ctx.beginPath();ctx.arc(0,0,6+ea*48,0,7);ctx.stroke();
   ctx.fillStyle='#ffd23f';for(i=0;i<9;i++){a=i/9*Math.PI*2;ctx.globalAlpha=1-ea;ctx.fillRect(Math.cos(a)*ea*34-1.6,Math.sin(a)*ea*34-1.6,3.2,3.2);}}
 } else if(f.kind==='void'){
  if(age<0.45){var vp=age/0.45;ctx.fillStyle=c;
   for(i=0;i<10;i++){a=i/10*Math.PI*2+vp*2.4;var vd=(1-vp)*38;ctx.globalAlpha=0.9;ctx.beginPath();ctx.arc(Math.cos(a)*vd,Math.sin(a)*vd,2.6,0,7);ctx.fill();}
   ctx.fillStyle='#0b0e18';ctx.globalAlpha=1;ctx.beginPath();ctx.arc(0,0,3+vp*6,0,7);ctx.fill();}
  else {var va=(age-0.45)/0.55;ctx.strokeStyle=c;ctx.lineWidth=2.6;ctx.globalAlpha=1-va;ctx.beginPath();ctx.arc(0,0,5+va*46,0,7);ctx.stroke();
   ctx.fillStyle=c;for(i=0;i<10;i++){a=i/10*Math.PI*2;ctx.globalAlpha=1-va;ctx.fillRect(Math.cos(a)*va*36-1.6,Math.sin(a)*va*36-1.6,3.2,3.2);}}
 } else if(f.kind==='glitch'){
  var off=Math.sin(age*46)*5*(1-age);
  ctx.globalAlpha=0.85*(1-age);
  ctx.fillStyle='#ff3b78';ctx.fillRect(-13+off,-13,26,26);
  ctx.fillStyle=c;ctx.fillRect(-13-off,-13,26,26);
  ctx.fillStyle='#0b0e18';ctx.fillRect(-9,-9,18,18);
  ctx.fillStyle=c;for(i=0;i<4;i++){ctx.fillRect(-22+prand(i,51)*44,-16+i*9,(10+prand(i,52)*16)*(1-age),2);}
  ctx.strokeStyle=c;ctx.lineWidth=2;ctx.globalAlpha=1-age;ctx.beginPath();ctx.arc(0,0,6+age*38,0,7);ctx.stroke();
 }
 ctx.restore(); ctx.globalAlpha=1;
}

function beep(f,d,type,g,when){if(save.mute)return;var a=ac();if(!a)return;try{
 var o=a.createOscillator(),gn=a.createGain();o.type=type||'square';o.frequency.value=f;
 var t=a.currentTime+(when||0);gn.gain.setValueAtTime(g||0.06,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.08));
 o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+(d||0.08)+0.02);}catch(e){}}
function noiseBurst(dur,g){if(save.mute)return;var a=ac();if(!a)return;try{
 var len=a.sampleRate*dur,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
 for(var i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
 var s=a.createBufferSource();s.buffer=buf;var gn=a.createGain();gn.gain.value=g;
 var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
 s.connect(f);f.connect(gn);gn.connect(a.destination);s.start();}catch(e){}}
function thump(f0,f1,d,g,when){if(save.mute)return;var a=ac();if(!a)return;try{
 var o=a.createOscillator(),gn=a.createGain();o.type='sine';
 var t=a.currentTime+(when||0);
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
 gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function crack(freq,d,g,when){if(save.mute)return;var a=ac();if(!a)return;try{
 var len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
 for(var i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
 var s=a.createBufferSource();s.buffer=buf;
 var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=0.9;
 var gn=a.createGain();gn.gain.value=g;
 s.connect(f);f.connect(gn);gn.connect(a.destination);s.start(a.currentTime+(when||0));}catch(e){}}
function zapSweep(f0,f1,d,g,when){if(save.mute)return;var a=ac();if(!a)return;try{
 var o=a.createOscillator(),gn=a.createGain();o.type='sawtooth';
 var t=a.currentTime+(when||0);
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
 gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);

 var t=a.currentTime+(when||0);o.frequency.value=f;
 gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}

function rollRarity(c){var t=0,k;for(k in c.odds)t+=c.odds[k];var r=Math.random()*t;
 for(var i=0;i<RARITIES.length;i++){var id=RARITIES[i].id;if(c.odds[id]){r-=c.odds[id];if(r<=0)return id;}}return 'common';}
function openCase(c,useChest){
 if(useChest){if(!save.chests||!(save.chests[c.id]>0))return null; save.chests[c.id]--;}
 else{if(save.coins<c.price)return null; save.coins-=c.price;}
 var rid=rollRarity(c);
 if(c.fxOnly||Math.random()<0.30){
  var fpool=KILLFX.filter(function(f){return f.rar===rid;});
  var fitem=fpool[Math.floor(Math.random()*fpool.length)];
  var fdupe=!!save.fxInv[fitem.id];
  if(fdupe){var fdc=DUPE_COINS[rid];save.coins+=fdc;persist();return{type:'fx',item:fitem,dupe:true,dupeCoins:fdc};}
  save.fxInv[fitem.id]=1;persist();return{type:'fx',item:fitem,dupe:false,dupeCoins:0};
 }
 var pool=SNIPERS.filter(function(s){return s.rar===rid;});
 var item=pool[Math.floor(Math.random()*pool.length)];
 var dupe=!!save.inv[item.id];
 if(dupe){var dc=DUPE_COINS[rid];save.coins+=dc;persist();return{type:'rifle',item:item,dupe:true,dupeCoins:dc};}
 save.inv[item.id]=1;persist();return{type:'rifle',item:item,dupe:false,dupeCoins:0};
}

 if(G.camTX<0)G.camTX=0;if(G.camTX>WORLD_W-viewW())G.camTX=WORLD_W-viewW();
 G.camY+=(G.camTY-G.camY)*Math.min(1,dt/55);

 if(G.camTY<0)G.camTY=0;if(G.camTY>WORLD_H-viewH())G.camTY=WORLD_H-viewH();
 /* gentle vertical aim-assist toward nearest visible enemy's mid-body */

  if(ae.state==='down'||ae.state==='dead')continue;

 for(var j=0;j<G.pops.length;j++){G.pops[j].t-=dt;G.pops[j].y-=dt/28;}
 G.pops=G.pops.filter(function(p){return p.t>0;});
 for(var j2=0;j2<G.bursts.length;j2++)G.bursts[j2].t-=dt;
 G.bursts=G.bursts.filter(function(b){return b.t>0;});
 for(var pj3=G.projs.length-1;pj3>=0;pj3--){var pr3=G.projs[pj3];pr3.t+=dt;
  if(pr3.type==='flame'){var pg=pr3.t/pr3.dur,fx3=pr3.x0+(pr3.x1-pr3.x0)*pg,fy3=pr3.y0+(pr3.y1-pr3.y0)*pg;

 for(var pt3=G.parts.length-1;pt3>=0;pt3--){G.parts[pt3].t-=dt;if(G.parts[pt3].t<=0)G.parts.splice(pt3,1);}
 if(G.hitmarkT>0)G.hitmarkT-=dt;
 for(var md2=0;md2<G.medals.length;md2++)G.medals[md2].t-=dt;
 G.medals=G.medals.filter(function(m){return m.t>0;});
 if(G.reloadUntil&&performance.now()>=G.reloadUntil){G.ammo=sniperById(save.equipped).mag;G.reloadUntil=0;}

 if(G.mode==='flag'){G.flagTick+=dt;

    if(G.flagCarrier===0)G.score=G.board[0].score;}}}
 G.ambT-=dt; if(G.ambT<=0){G.ambT=4200+Math.random()*3800;ambientEvent();}
 if(!G.dead&&G.hp>0&&G.hp<100&&performance.now()-G.lastHurt>4000)G.hp=Math.min(100,G.hp+dt*0.03);
 G.recT+=dt;

  G.rec.push({c:G.camX,y:G.camY,z:G.zoom,en:G.enemies.map(function(e){return{x:e.x,y:e.y,st:e.state,hp:e.hp,gun:e.gun.id,col:e.color,nm:e.name,al:e.ally?1:0};})});

 /* fight */
 if(!G.dead){

 }

function drawEnemy(e,now){
 var reveal=1;
 if(e.state==='peek')reveal=Math.min(1,e.t/320);
 if(e.state==='down')reveal=0.12;
 if(e.state==='dead')reveal=Math.max(0,1-e.t/450);
 var hgt=48*reveal, x=e.x, y=e.y;
 ctx.save();ctx.globalAlpha=e.state==='dead'?reveal:1;
 if(e.state==='dead')ctx.translate(x,y),ctx.rotate(Math.min(1,e.t/450)*1.2),ctx.translate(-x,-y);
 /* legs behind cover */
 ctx.fillStyle='#141a26';ctx.fillRect(x-8,y-14,16,14);
 /* torso */
 ctx.fillStyle=e.color;ctx.fillRect(x-9,y-hgt+14,18,Math.max(0,hgt-14));
 /* head */
 if(hgt>26){ctx.fillStyle='#d9a066';ctx.beginPath();ctx.arc(x,y-hgt+7,7,0,7);ctx.fill();
  ctx.fillStyle='#141a26';ctx.fillRect(x-7,y-hgt-1,14,4);} /* cap */
 /* rifle pointing toward player side */
 ctx.strokeStyle='#0c0f16';ctx.lineWidth=3;ctx.beginPath();
 ctx.moveTo(x-4,y-hgt+20);ctx.lineTo(x+(e.x<WORLD_W/2?16:-16),y-hgt+16);ctx.stroke();
 /* scope glint while aiming */
 if(e.state==='aim'){
  var gx=x+(e.x<WORLD_W/2?13:-13), gy=y-hgt+15;
  var pulse=0.5+0.5*Math.sin(now/90);
  ctx.fillStyle='rgba(255,255,255,'+(0.35+0.6*pulse)+')';
  ctx.beginPath();ctx.arc(gx,gy,2.6,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,'+(0.25+0.5*pulse)+')';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(gx-6,gy);ctx.lineTo(gx+6,gy);ctx.moveTo(gx,gy-6);ctx.lineTo(gx,gy+6);ctx.stroke();
 }
 ctx.restore();
 if(e.state!=='dead'){
  if(e.hp<100&&e.state!=='down'){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(x-13,y-58,26,4);ctx.fillStyle=e.hp>40?'#3fe07a':'#ff4040';ctx.fillRect(x-12,y-57,24*Math.max(0,e.hp)/100,2);}

 if(e.blindT>0){ctx.save();ctx.translate(x,y-54);ctx.rotate(now/300);ctx.fillStyle='rgba(255,255,240,0.95)';ctx.fillRect(-7,-1.2,14,2.4);ctx.fillRect(-1.2,-7,2.4,14);ctx.restore();}
  if(e.burnT>0){ctx.fillStyle='rgba(255,106,0,'+(0.45+0.3*Math.sin(now/70))+')';ctx.beginPath();ctx.arc(x,y-30,11+2*Math.sin(now/90),0,7);ctx.fill();ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x,y-32,5.5,0,7);ctx.fill();}
  if(e.flashT>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.8,e.flashT/200)+')';ctx.fillRect(x-10,y-46,20,36);}
 }
 /* name tag */
 if(e.state!=='dead'&&reveal>0.5){ctx.font='bold 9px Verdana';ctx.textAlign='center';

}

  panel(80,120,320,300,'rgba(10,14,24,0.98)','#2affd5');
  txt('⏸ PAUSED',240,152,20,'#ffffff','center');
  txt('AIM SENSITIVITY',240,192,12,'#9fd8ff','center');
  txt((save.sens||1).toFixed(2)+'×',240,222,18,'#ffd23f','center');
  addBtn(116,204,52,36,'−',function(){save.sens=Math.max(0.5,Math.round(((save.sens||1)-0.25)*100)/100);persist();SFX.click();},'ghost');
  addBtn(312,204,52,36,'+',function(){save.sens=Math.min(2,Math.round(((save.sens||1)+0.25)*100)/100);persist();SFX.click();},'ghost');
  addBtn(130,262,220,44,'▶  RESUME',function(){G.paused=false;SFX.click();});
  addBtn(130,316,220,40,'↻  RESTART MATCH',function(){var m=G.mode;SFX.click();newRun(m);},'ghost');
  addBtn(130,364,220,40,'EXIT TO TITLE',function(){SFX.click();screen='title';G=null;},'ghost');
 }
}
function cycleZoom(){
 if(!G)return;var eq=sniperById(save.equipped);
 var cxp=G.camX+viewW()/2, cyp=G.camY+viewH()/2;
 G.zoom=G.zoom>=eq.zoom?1:G.zoom+1;G.adsT=performance.now();
 G.camTX=cxp-viewW()/2;G.camX=G.camTX;
 G.camTY=Math.max(0,Math.min(WORLD_H-viewH(),cyp-viewH()/2));G.camY=G.camTY;
 SFX.click();
}
function drawOver(){
 skyBG('#160d16','#160d16');header('MATCH RESULT');
 var sb=sortedBoard(), rank=1;
 for(var ri=0;ri<sb.length;ri++)if(sb[ri].i===0)rank=ri+1;
 var title, tc;
 if(G.mode==='tdm'){var ta=teamKills('A'),tb=teamKills('B');title=ta>tb?'VICTORY':(ta<tb?'DEFEAT':'DRAW');tc=ta>tb?'#8dff9a':(ta<tb?'#ff7a7a':'#ffd23f');}
 else{title=rank===1?'★ VICTORY ★':'#'+rank+' PLACE';tc=rank===1?'#8dff9a':'#ffd23f';}
 txt(title,240,82,25,tc,'center');
 txt(MODES[G.mode].name+' · '+curMap().name,240,108,12,'#9fb4cc','center');
 panel(40,124,400,202,'rgba(13,18,30,0.95)','#3a465e');
 txt('SCOREBOARD',60,140,11,'#8fa8c8','left');
 txt('K     D     SCORE',420,140,10,'#8fa8c8','right');
 var y=164;
 for(var i=0;i<sb.length;i++){var r=sb[i],b=r.b;
  if(b.you){ctx.fillStyle='rgba(42,255,213,0.13)';ctx.fillRect(48,y-10,384,20);}
  txt((i+1)+'. '+(G.mode==='flag'&&G.flagCarrier===r.i?'🚩 ':'')+b.name+(G.mode==='tdm'&&b.team==='A'&&!b.you?' (ALLY)':''),60,y,12,b.you?'#2affd5':'#ffffff','left');
  txt(b.kills+'     '+b.deaths+'     '+b.score,420,y,12,'#ffffff','right');y+=22;}
 panel(40,336,400,62,'rgba(13,18,30,0.95)','#3a465e');
 txt('YOUR MATCH',60,352,11,'#8fa8c8','left');
 if(G.score>=save.best&&G.score>0)txt('★ NEW BEST ★',420,352,11,'#ffd23f','right');
 txt('KILLS '+G.kills+' · HEADSHOTS '+G.heads+' · ACC '+(G.shots?Math.round(G.hits/G.shots*100):0)+'% · +'+G.coinsEarned+'⬢',60,376,12,'#ffffff','left');
 if(G.bestSeg)addBtn(40,412,190,44,'▶ BEST PLAY',function(){G.bpIdx=0;G.bpLast=0;SFX.click();screen='bestplay';},'ghost');
 addBtn(G.bestSeg?250:90,412,G.bestSeg?190:300,44,'↻ REMATCH',function(){SFX.click();newRun(G.mode);screen='game';});
 addBtn(90,468,144,40,'MODES',function(){SFX.click();screen='modes';},'ghost');
 addBtn(246,468,144,40,'TITLE',function(){SFX.click();screen='title';},'ghost');
}

/* ---------------- INPUT ---------------- */
var drag=null;
function evtPos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',function(e){
 e.preventDefault();ac();
 var p=evtPos(e);
 for(var i=buttons.length-1;i>=0;i--){var b=buttons[i];
  if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
   if(b.label==='DUCK'&&screen==='game'){G.ducking=true;drag={duck:true};return;}
   if(b.style==='cell'){drag={x:p.x,y:p.y,scroll:armScroll,moved:0,t:performance.now(),cell:b};return;}
   b.cb(); return;}}
 if(screen==='game'&&G){drag={x:p.x,y:p.y,camTX:G.camTX,camTY:G.camTY,moved:0,t:performance.now()};}
 else if(screen==='armory'){drag={x:p.x,y:p.y,scroll:armScroll,moved:0,t:performance.now()};}
});
cv.addEventListener('pointermove',function(e){
 if(!drag)return;var p=evtPos(e);
 if(drag.duck)return;
 drag.moved=Math.max(drag.moved,Math.abs(p.x-drag.x)+Math.abs(p.y-drag.y));
 if(screen==='game'&&G){var sn=save.sens||1;G.camTX=drag.camTX-(p.x-drag.x)/G.zoom*sn;G.camTY=drag.camTY-(p.y-drag.y)/G.zoom*sn;}
 else if(screen==='armory'){armScroll=drag.scroll-(p.y-drag.y);}
});
function endPointer(e){
 if(drag&&drag.duck&&G)G.ducking=false;
 if(drag&&drag.cell&&drag.moved<8)drag.cell.cb();
 if(drag&&screen==='game'&&G&&drag.moved<8&&performance.now()-drag.t<300&&!drag.duck)fire();
 drag=null;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('wheel',function(e){
 e.preventDefault();
 if(screen==='game'&&G){G.camTX+=(e.deltaY>0?80:-80)*(save.sens||1);}
 else if(screen==='armory'){armScroll+=e.deltaY*0.6;}
},{passive:false});
document.addEventListener('keydown',function(e){
 if(screen==='game'&&G){
  if(e.key==='ArrowRight')G.camTX+=90;
  else if(e.key==='ArrowLeft')G.camTX-=90;
  else if(e.key==='ArrowDown'){G.camTY+=60;G.ducking=true;}
  else if(e.key==='ArrowUp')G.camTY-=60;
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();fire();}
  else if(e.key==='z'||e.key==='Z')cycleZoom();
 }
});
document.addEventListener('keyup',function(e){if(G&&e.key==='ArrowDown')G.ducking=false;});
window.addEventListener('sideClick',function(){if(screen==='game')fire();});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------------- LOOP ---------------- */
var lastT=performance.now();
function loop(now){
 var dt=Math.min(50,now-lastT);lastT=now;
 update(dt);draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

 newRun:newRun,fire:fire,openCase:openCase,startOpening:startOpening,buildStrip:buildStrip,tracerOf:tracerOf,TRACERS:TRACERS,spawnEnemy:spawnEnemy,KILLFX:KILLFX,killFxById:killFxById,MAPS:MAPS,curMap:curMap,nextWave:nextWave,
 sniperById:sniperById,ownedCount:ownedCount,damageEnemy:damageEnemy,killEnemy:killEnemy,resolveShot:resolveShot,PROJ:PROJ,projOf:projOf,medal:medal,startReload:startReload,MODES:MODES,endMatch:endMatch,playerDie:playerDie,respawnPlayer:respawnPlayer,ambientEvent:ambientEvent,spawnAlly:spawnAlly,teamKills:teamKills,sortedBoard:sortedBoard};
